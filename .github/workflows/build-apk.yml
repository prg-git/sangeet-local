name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Sangeet Local Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-apk-project/gradlew

      - name: Build APK with Gradle
        working-directory: android-apk-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android-apk-project/app/build/outputs/apk/debug/app-debug.apk Sangeet-Local.apk
          ls -lh Sangeet-Local.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sangeet-Local-APK
          path: Sangeet-Local.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.00
          name: "Sangeet Local v2.0.00 (Android APK)"
          body: |
            ## 🎵 Sangeet Local - Android App (APK) v2.0.00
            **Version:** 2.0.00  
            **Developed at Basugaon by Parag**

            ### 📱 What's New in Version 2.0.00:
            - **Modern Redesigned Fullscreen Now Playing Studio**:
              - Expanded view with ambient glow, glowing album art halo, and real-time audio visualizer sound waves.
              - Full playback deck: Play/Pause hero button, Skip Forward/Backward, Shuffle, and Repeat.
              - Live seek timeline scrubber with thumb indicator and millisecond tracking.
              - Pull-up frosted glass Lyrics sheet with real-time word view.
              - Quick audio Equalizer shortcut.
            - **Upgraded Floating Mini-Player Island**:
              - Glowing glassmorphic container with 7-band live soundwave equalizer.
              - Instant expand gesture into the full Now Playing screen.
            - **Enhanced APK Performance & Seeking**:
              - Smooth touch seeking & scrubbing for local Bodo & regional songs.
              - Reliable Liked/Favorites persistence across app launches.
              - Automatic background audio focus handling.

            ### 📥 How to Install / Update on your Phone:
            1. Tap **`Sangeet-Local.apk`** below to download the updated APK.
            2. When the download completes, tap the notification or open your **Files / Downloads** folder.
            3. Tap **Install** / **Update**.
            4. Open **Sangeet Local** and enjoy the new Version 2.0.00 experience!
          files: Sangeet-Local.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
