name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Sangeet Local Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-apk-project/gradlew

      - name: Build APK with Gradle
        working-directory: android-apk-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android-apk-project/app/build/outputs/apk/debug/app-debug.apk Sangeet-Local.apk
          ls -lh Sangeet-Local.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sangeet-Local-APK
          path: Sangeet-Local.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "Sangeet Local v2.0.0 (Android APK)"
          body: |
            ## 🎵 Sangeet Local - Android App (APK) v2.0.0
            **Version:** 2.0.0  
            **Developed at Basugaon by Parag**

            ### 📱 What's New in Version 2.0.0:
            - **Modern Redesigned Theme & Elements**:
              - Deep OLED Obsidian glassmorphic theme with radiant Cyber Cyan & Aurora Violet accents.
              - High-resolution luxury 3D music app icon with glowing neon sound waves.
              - Floating mini-player island with live equalizer bars and fluid expand animation.
              - Mobile-optimized song details row displaying Title, Artist, Album, Genre, and Duration cleanly fitted.
              - Interactive Song Details Bottom Sheet with full metadata and quick play/like actions.
            - **Mobile Experience & Bug Fixes**:
              - Fixed Queue Drawer on mobile devices to slide smoothly as a responsive bottom sheet.
              - Interactive Mobile Search & Discovery hub with instant genre explorer chips.
              - High performance 60fps animations and hardware acceleration.
              - Audio seek scrubbing and persistent favorites/liked sync.

            ### 📥 How to Install / Update on your Phone:
            1. Tap **`Sangeet-Local.apk`** below to download the updated APK.
            2. When the download completes, tap the notification or open your **Files / Downloads** folder.
            3. Tap **Install** / **Update**.
            4. Open **Sangeet Local** and enjoy the new Version 2.0.0 experience!
          files: Sangeet-Local.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
