name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Sangeet Local Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Latest Web App Files to Android Assets
        run: |
          mkdir -p android-apk-project/app/src/main/assets
          cp -r index.html css js icons data music manifest.json sw.js android-apk-project/app/src/main/assets/

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-apk-project/gradlew

      - name: Build APK with Gradle
        working-directory: android-apk-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android-apk-project/app/build/outputs/apk/debug/app-debug.apk Sangeet-Local.apk
          ls -lh Sangeet-Local.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sangeet-Local-APK
          path: Sangeet-Local.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Sangeet Local v1.0.0 (Android APK)"
          body: |
            ## 🎵 Sangeet Local - Android App (APK)
            **Version:** 1.0.0  
            **Developed at Basugaon by Parag**

            ### 📱 What is included in this APK:
            - **100% Mobile View Music Player**: Specifically packaged for Android smartphones.
            - **Animated Equalizer Splash Screen**: Beat loading indicator with smooth transitions.
            - **Glowing Audio Visualizer**: Live flowing sound waves and 5-band equalizer bars when music plays.
            - **Offline Music Support**: Packaged with all mobile view assets, music tracks, album art, and database.
            - **Online Sync**: Long-press anywhere to connect to live GitHub Pages or PC Wi-Fi server.

            ### 📥 How to Install on your Phone:
            1. Tap **`Sangeet-Local.apk`** below to download it directly to your phone.
            2. When the download completes, tap the notification or open your **Files / Downloads** folder.
            3. Tap **Install** (if prompted, enable *"Install from this source"*).
            4. Open **Sangeet Local** from your home screen or app drawer!
          files: Sangeet-Local.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
