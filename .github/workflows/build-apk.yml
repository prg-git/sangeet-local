name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Sangeet Local Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-apk-project/gradlew

      - name: Build APK with Gradle
        working-directory: android-apk-project
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log

      - name: Prepare APK for Release
        run: |
          cp android-apk-project/app/build/outputs/apk/debug/app-debug.apk Sangeet-Local.apk
          ls -lh Sangeet-Local.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sangeet-Local-APK
          path: Sangeet-Local.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "Sangeet Local v2.0.0 (Android APK)"
          body: |
            ## 🎵 Sangeet Local - Android App (APK) v2.0.0
            **Version:** 2.0.0  
            **Developed at Basugaon by Parag**

            ### 📱 What's New in Version 2.0.0:
            - **Modern Redesigned Home UI & Aesthetic**:
              - Sleek Modern Home UI: Dynamic greeting ("Good Morning/Evening"), "Find your rhythm." headline.
              - Rounded dark capsule search bar with "Songs, artists, or a feeling" placeholder.
              - Electric Lime active filter pills ("For you", "Bodo", "Koch Rajbongshi", "Assamese", "Liked").
              - Split Hero Mood Card ("MADE FOR YOUR MOOD", "Discover weekly") with glowing circular play button.
              - "Your rotation" section cards with smooth rounded artwork and metadata subtitles.
              - Streamlined 4-tab bottom navigation (Home, Search, Library, Liked) with Menu section removed.
              - Modern minimalist glowing splash screen with pulsing dots and fast 200ms dismiss.
            - **Mobile Experience & Bug Fixes**:
              - Repeat feature completely fixed: Repeat All, Repeat One, and Repeat Off now cycle properly with synchronized icons (🔁 and 🔂).
              - Deleted outdated architecture and engineering cards from About.
              - Ultra-fast startup (<250ms) with zero flicker or glitch.
              - Auto-restores default or last played track on launch so the player is never blank.
              - 100% circular vinyl album disc animation with center spindle hole when playing ("square run fixed to round").
              - High-performance IndexedDB memory caching for instant 0ms catalog loads.
              - Fixed Queue Drawer on mobile devices to slide smoothly as a responsive bottom sheet.
              - Audio seek scrubbing and persistent favorites/liked sync.

            ### 📥 How to Install / Update on your Phone:
            1. Tap **`Sangeet-Local.apk`** below to download the updated APK.
            2. When the download completes, tap the notification or open your **Files / Downloads** folder.
            3. Tap **Install** / **Update**.
            4. Open **Sangeet Local** and enjoy the new Version 2.0.0 experience!
          files: Sangeet-Local.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
